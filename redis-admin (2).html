<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Redis Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00c896;--teal-dim:#00b085;--teal-bg:#e6faf5;--teal-text:#007a5a;
  --bg:#f0f0ee;--surface:#ffffff;--surface2:#f7f7f6;--surface3:#f0f0ee;
  --border:#e2e2df;--border2:#d4d4d0;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9b9b97;
  --blue-bg:#e8f4ff;--blue-text:#0066cc;
  --red-bg:#fff0f0;--red-text:#cc2200;
  --yellow-bg:#fffbe6;--yellow-text:#8a6000;
  --purple-bg:#f3f0ff;--purple-text:#5500cc;
  --pink-bg:#fff0f8;--pink-text:#cc0077;
  --radius:6px;--radius-lg:10px;
  --mono:'SF Mono','Fira Code','Cascadia Code',monospace;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sidebar:280px;
}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
html,body{height:100%;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--bg);}

/* ── Setup screen ── */
.setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,0.07)}
.setup-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.setup-logo .dot{width:28px;height:28px;background:var(--teal);border-radius:6px;display:flex;align-items:center;justify-content:center}
.setup-logo .dot svg{width:16px;height:16px;fill:white}
.setup-logo span{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.setup h2{font-size:15px;font-weight:600;margin-bottom:4px}
.setup p{font-size:12px;color:var(--text2);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px}
.field input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,200,150,0.15)}
.btn-connect{width:100%;padding:10px;background:var(--teal);color:white;border:none;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-connect:hover{background:var(--teal-dim)}
.btn-connect:disabled{opacity:0.5;cursor:not-allowed}

/* ── App shell ── */
#app{display:none;height:100vh;flex-direction:column}
.topnav{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;padding:0;flex-shrink:0}
.nav-brand{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid var(--border);height:100%}
.nav-brand .dot{width:22px;height:22px;background:var(--teal);border-radius:5px;display:flex;align-items:center;justify-content:center}
.nav-brand .dot svg{width:12px;height:12px;fill:white}
.nav-brand span{font-size:13px;font-weight:600}
.nav-tabs{display:flex;height:100%;align-items:center;padding:0 8px;gap:2px}
.nav-tab{padding:6px 12px;font-size:12px;font-weight:500;color:var(--text2);border-radius:var(--radius);cursor:pointer;border:none;background:none;display:flex;align-items:center;gap:6px}
.nav-tab.active{background:var(--teal-bg);color:var(--teal-text);font-weight:600}
.nav-tab:hover:not(.active){background:var(--surface3)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 12px}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.conn-label{font-size:11px;color:var(--text2)}
.btn-sm{padding:5px 12px;font-size:12px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);cursor:pointer;color:var(--text);transition:background .12s}
.btn-sm:hover{background:var(--surface3)}

/* ── Main layout ── */
.main{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:10px 10px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-row{display:flex;gap:6px;margin-bottom:8px}
.type-select{padding:5px 8px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--sans);outline:none;cursor:pointer;flex-shrink:0}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:5px 8px 5px 28px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);outline:none;font-family:var(--sans)}
.search-wrap input:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(0,200,150,0.12)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.scan-info{display:flex;align-items:center;justify-content:space-between}
.scan-count{font-size:11px;color:var(--text3)}
.btn-reload{padding:4px 6px;border:none;background:none;cursor:pointer;color:var(--text3);border-radius:4px;display:flex;align-items:center}
.btn-reload:hover{background:var(--surface3);color:var(--text)}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.key-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;transition:background .1s;position:relative}
.key-item:hover{background:var(--surface3)}
.key-item.active{background:var(--teal-bg)}
.key-item.active .key-item-name{color:var(--teal-text);font-weight:500}
.type-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
.type-icon.string{background:#dbeafe;color:#1d4ed8}
.type-icon.hash{background:#dcfce7;color:#15803d}
.type-icon.list{background:#fef9c3;color:#854d0e}
.type-icon.set{background:#fce7f3;color:#9d174d}
.type-icon.zset{background:#ede9fe;color:#5b21b6}
.key-item-name{font-size:12px;font-family:var(--mono);color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key-item-arrow{color:var(--text3);flex-shrink:0;font-size:10px}
.key-item.active .key-item-arrow{color:var(--teal)}
.load-more-btn{margin:6px 4px;padding:8px;text-align:center;font-size:12px;color:var(--teal-text);background:none;border:1px dashed var(--teal);border-radius:var(--radius);cursor:pointer;width:calc(100% - 8px);font-family:var(--sans);font-weight:500;transition:background .12s}
.load-more-btn:hover{background:var(--teal-bg)}
.load-more-btn:disabled{opacity:0.5;cursor:not-allowed}
.sidebar-resize{width:4px;background:transparent;cursor:col-resize;flex-shrink:0}
.sidebar-resize:hover{background:var(--teal)}

/* ── Detail panel ── */
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface2)}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:8px}
.detail-empty svg{width:40px;height:40px;opacity:0.3}
.detail-empty p{font-size:13px}

.detail-inner{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-header{padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.detail-key-name{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text);margin-bottom:8px;word-break:break-all}
.detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--sans)}
.meta-badge.string{background:#dbeafe;color:#1d4ed8}
.meta-badge.hash{background:#dcfce7;color:#15803d}
.meta-badge.list{background:#fef9c3;color:#854d0e}
.meta-badge.set{background:#fce7f3;color:#9d174d}
.meta-badge.zset{background:#ede9fe;color:#5b21b6}
.meta-tag{padding:3px 10px;border-radius:20px;font-size:11px;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.ttl-tag{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);cursor:pointer}
.ttl-tag:hover{border-color:var(--teal);color:var(--teal-text)}
.detail-actions{margin-left:auto;display:flex;gap:6px}
.btn-del{padding:5px 12px;font-size:12px;font-weight:500;border-radius:var(--radius);border:1px solid #fca5a5;background:#fff5f5;cursor:pointer;color:#b91c1c;transition:background .12s}
.btn-del:hover{background:#fee2e2}
.btn-save{padding:5px 16px;font-size:12px;font-weight:600;border-radius:var(--radius);border:none;background:var(--teal);cursor:pointer;color:white;transition:background .12s}
.btn-save:hover{background:var(--teal-dim)}

.detail-body{flex:1;overflow:auto;padding:0}
.value-label{padding:10px 16px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);background:var(--surface)}
.value-label select{font-size:11px;border:none;background:none;color:var(--text2);cursor:pointer;outline:none;font-family:var(--sans);font-weight:600}
.value-area{flex:1;padding:12px 16px}
.value-textarea{width:100%;min-height:320px;font-family:var(--mono);font-size:12px;padding:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;resize:vertical;line-height:1.6;transition:border-color .15s,box-shadow .15s}
.value-textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,200,150,0.12)}

/* hash/list table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:7px 10px;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface3);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.3px}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);vertical-align:top;word-break:break-all}
.data-table tr:hover td{background:var(--teal-bg)}
.data-table .idx{color:var(--text3);width:50px;text-align:right}
.data-table .key-col{color:var(--text2);width:180px}
.data-table .val-col{color:var(--text)}

/* detail footer */
.detail-footer{padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0}

/* ── TTL inline edit ── */
.ttl-edit{display:flex;align-items:center;gap:6px}
.ttl-edit input{width:90px;padding:3px 8px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;font-family:var(--mono)}
.ttl-edit input:focus{border-color:var(--teal)}
.ttl-edit .apply-btn{padding:3px 8px;font-size:11px;font-weight:600;border:none;background:var(--teal);color:white;border-radius:var(--radius);cursor:pointer}
.ttl-edit .cancel-btn{padding:3px 8px;font-size:11px;font-weight:500;border:1px solid var(--border2);background:none;color:var(--text2);border-radius:var(--radius);cursor:pointer}

/* loading/spinner */
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;padding:20px 16px;color:var(--text2);font-size:12px}

/* notification toast */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--teal);color:white}
.toast.err{background:#b91c1c;color:white}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* kbd */
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;background:var(--surface3);border:1px solid var(--border2);border-radius:3px;color:var(--text2)}

/* add key panel */
.add-key-panel{position:absolute;right:12px;top:48px;width:320px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,0.12);z-index:50;padding:16px}
.add-key-panel h3{font-size:13px;font-weight:600;margin-bottom:14px}
.add-field{margin-bottom:10px}
.add-field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.add-field input,.add-field select,.add-field textarea{width:100%;padding:7px 10px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);outline:none;font-family:var(--mono)}
.add-field input:focus,.add-field select:focus,.add-field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(0,200,150,0.12)}
.add-field textarea{min-height:70px;resize:vertical}
.add-field select{font-family:var(--sans)}
.add-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.btn-cancel{padding:6px 14px;font-size:12px;border:1px solid var(--border2);background:none;color:var(--text2);border-radius:var(--radius);cursor:pointer}
.btn-cancel:hover{background:var(--surface3)}
.btn-create{padding:6px 14px;font-size:12px;font-weight:600;border:none;background:var(--teal);color:white;border-radius:var(--radius);cursor:pointer}
.btn-create:hover{background:var(--teal-dim)}

/* overlay for add panel close */
.overlay{position:fixed;inset:0;z-index:40;background:transparent}
</style>
</head>
<body>

<!-- Setup screen -->
<div class="setup" id="setup">
  <div class="setup-card">
    <div class="setup-logo">
      <div class="dot"><svg viewBox="0 0 16 16"><path d="M8 2C4.7 2 2 4.7 2 8s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm0 2c.8 0 1.5.2 2.1.6L4.6 10.1C4.2 9.5 4 8.8 4 8c0-2.2 1.8-4 4-4zm0 8c-.8 0-1.5-.2-2.1-.6l5.5-5.5c.4.6.6 1.3.6 2.1 0 2.2-1.8 4-4 4z"/></svg></div>
      <span>Redis Admin</span>
    </div>
    <h2>Connect to Upstash</h2>
    <p>Enter your REST API credentials to get started</p>
    <div class="field">
      <label>REST API URL</label>
      <input id="cfg-url" type="text" placeholder="https://your-db.upstash.io" />
    </div>
    <div class="field">
      <label>REST API Token</label>
      <input id="cfg-token" type="password" placeholder="Your token..." />
    </div>
    <button class="btn-connect" id="btn-connect" onclick="connect()">Connect</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <nav class="topnav">
    <div class="nav-brand">
      <div class="dot"><svg viewBox="0 0 16 16"><path d="M8 2C4.7 2 2 4.7 2 8s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm0 2c.8 0 1.5.2 2.1.6L4.6 10.1C4.2 9.5 4 8.8 4 8c0-2.2 1.8-4 4-4zm0 8c-.8 0-1.5-.2-2.1-.6l5.5-5.5c.4.6.6 1.3.6 2.1 0 2.2-1.8 4-4 4z"/></svg></div>
      <span>Redis Admin</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Data Browser
      </button>
    </div>
    <div class="nav-right">
      <div class="conn-dot"></div>
      <span class="conn-label" id="conn-label">Connected</span>
      <button class="btn-sm" onclick="showSetup()">Disconnect</button>
    </div>
  </nav>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="filter-row">
          <select class="type-select" id="type-filter" onchange="applyFilter()">
            <option value="">All Types</option>
            <option value="string">String</option>
            <option value="hash">Hash</option>
            <option value="list">List</option>
            <option value="set">Set</option>
            <option value="zset">ZSet</option>
          </select>
          <div class="search-wrap">
            <svg class="search-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="search-box" type="text" placeholder="Search" oninput="applyFilter()" onkeydown="if(event.key==='Enter')startScan()" />
          </div>
          <button class="btn-reload" onclick="startScan()" title="Refresh">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>
        </div>
        <div class="scan-info">
          <span class="scan-count" id="scan-count">0 keys</span>
          <button class="btn-sm" style="font-size:11px;padding:3px 10px" onclick="showAddKey()">+ Key</button>
        </div>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </div>
    <div class="sidebar-resize" id="resizer"></div>

    <!-- Detail -->
    <div class="detail" id="detail">
      <div class="detail-empty" id="detail-empty">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7"/><path d="M4 17c0 1.1 3.58 2 8 2s8-.9 8-2"/><ellipse cx="12" cy="17" rx="8" ry="2"/></svg>
        <p>Select a key to view its value</p>
      </div>
      <div class="detail-inner" id="detail-inner" style="display:none"></div>
    </div>
  </div>
</div>

<!-- Add key panel (hidden) -->
<div id="add-key-panel" class="add-key-panel" style="display:none">
  <h3>Add New Key</h3>
  <div class="add-field"><label>Key name</label><input id="ak-key" type="text" placeholder="e.g. user:1234"/></div>
  <div class="add-field">
    <label>Type</label>
    <select id="ak-type" onchange="updateAddValueHint()">
      <option value="string">String</option>
      <option value="hash">Hash</option>
      <option value="list">List</option>
      <option value="set">Set</option>
      <option value="zset">ZSet</option>
    </select>
  </div>
  <div class="add-field"><label id="ak-val-label">Value</label><textarea id="ak-val" placeholder='e.g. hello world'></textarea></div>
  <div class="add-field"><label>TTL (seconds, optional)</label><input id="ak-ttl" type="number" min="1" placeholder="leave empty = no expiry"/></div>
  <div class="add-btns">
    <button class="btn-cancel" onclick="hideAddKey()">Cancel</button>
    <button class="btn-create" onclick="createKey()">Create</button>
  </div>
</div>
<div class="overlay" id="overlay" style="display:none" onclick="hideAddKey()"></div>
<div class="toast" id="toast"></div>

<script>
let API_URL='', API_TOKEN='';
let allKeys=[], keyMeta={};
let filteredKeys=[];
let scanCursor=null;
let activeKey=null;
let ttlEditMode=false;

// ── Connection ────────────────────────────────────────────────────────────────
async function connect(){
  API_URL=document.getElementById('cfg-url').value.trim().replace(/\/$/,'');
  API_TOKEN=document.getElementById('cfg-token').value.trim();
  if(!API_URL||!API_TOKEN){toast('Fill in URL and token','err');return;}
  const btn=document.getElementById('btn-connect');
  btn.disabled=true;btn.textContent='Connecting...';
  try{
    await redis(['PING']);
    document.getElementById('setup').style.display='none';
    document.getElementById('app').style.display='flex';
    startScan();
  }catch(e){toast('Failed: '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent='Connect';}
}
function showSetup(){
  document.getElementById('app').style.display='none';
  document.getElementById('setup').style.display='flex';
  allKeys=[];keyMeta={};scanCursor=null;activeKey=null;
}

// ── API ───────────────────────────────────────────────────────────────────────
async function redis(cmd){
  const r=await fetch(API_URL+'/'+cmd.map(c=>encodeURIComponent(String(c))).join('/'),{
    headers:{Authorization:'Bearer '+API_TOKEN}
  });
  if(!r.ok)throw new Error('HTTP '+r.status+': '+await r.text());
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  return d.result;
}
async function pipeline(cmds){
  if(!cmds.length)return[];
  const r=await fetch(API_URL+'/pipeline',{
    method:'POST',
    headers:{Authorization:'Bearer '+API_TOKEN,'Content-Type':'application/json'},
    body:JSON.stringify(cmds)
  });
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  return d.map(x=>x.result);
}

// ── Scan ─────────────────────────────────────────────────────────────────────
function startScan(){
  allKeys=[];keyMeta={};scanCursor='0';filteredKeys=[];
  renderSidebar([]);
  loadBatch();
}
async function loadBatch(){
  if(scanCursor==='done')return;
  const pattern=document.getElementById('search-box').value.trim()||'*';
  setSidebarLoading(true);
  try{
    const res=await redis(['SCAN',scanCursor,'MATCH',pattern,'COUNT','100']);
    const next=res[0], keys=res[1]||[];
    if(keys.length){
      const [types,ttls]=await Promise.all([
        pipeline(keys.map(k=>['TYPE',k])),
        pipeline(keys.map(k=>['TTL',k]))
      ]);
      keys.forEach((k,i)=>{
        allKeys.push(k);
        keyMeta[k]={type:types[i],ttl:ttls[i]};
      });
    }
    scanCursor=next==='0'?'done':next;
    applyFilter();
    // auto-load more if we got < 20 visible and scan not done
    if(scanCursor!=='done'&&filteredKeys.length<30)loadBatch();
  }catch(e){toast(e.message,'err');}
  finally{setSidebarLoading(false);}
}
function setSidebarLoading(on){
  let el=document.getElementById('sidebar-spinner');
  if(on&&!el){
    el=document.createElement('div');el.id='sidebar-spinner';el.className='loading-row';
    el.innerHTML='<span class="spinner"></span>Loading keys...';
    document.getElementById('sidebar-list').appendChild(el);
  }else if(!on&&el)el.remove();
}

// ── Filter / render sidebar ───────────────────────────────────────────────────
function applyFilter(){
  const q=document.getElementById('search-box').value.trim().toLowerCase().replace(/\*/g,'');
  const type=document.getElementById('type-filter').value;
  filteredKeys=allKeys.filter(k=>{
    if(type&&keyMeta[k]?.type!==type)return false;
    if(q&&!k.toLowerCase().includes(q))return false;
    return true;
  });
  renderSidebar(filteredKeys);
}
function renderSidebar(keys){
  const list=document.getElementById('sidebar-list');
  // keep spinner if present
  const spinner=document.getElementById('sidebar-spinner');
  list.innerHTML='';
  if(spinner)list.appendChild(spinner);

  document.getElementById('scan-count').textContent=
    keys.length+(allKeys.length>keys.length?' / '+allKeys.length:'')+' keys'+(scanCursor!=='done'?' …':'');

  if(!keys.length&&!spinner){
    const emp=document.createElement('div');
    emp.style.cssText='padding:24px 12px;text-align:center;color:var(--text3);font-size:12px';
    emp.textContent=allKeys.length?'No keys match filter':'No keys found';
    list.appendChild(emp);
    return;
  }

  keys.forEach(k=>{
    const m=keyMeta[k]||{};
    const type=m.type||'string';
    const abbr={string:'S',hash:'H',list:'L',set:'S',zset:'Z'}[type]||'?';
    const item=document.createElement('div');
    item.className='key-item'+(activeKey===k?' active':'');
    item.dataset.key=k;
    item.innerHTML=`
      <div class="type-icon ${type}">${abbr}</div>
      <span class="key-item-name" title="${escHtml(k)}">${escHtml(k)}</span>
      <span class="key-item-arrow">›</span>`;
    item.onclick=()=>selectKey(k);
    list.insertBefore(item,spinner||null);
  });

  // load more button
  if(scanCursor!=='done'){
    const btn=document.createElement('button');
    btn.className='load-more-btn';
    btn.id='load-more-btn';
    btn.innerHTML='Load more keys…';
    btn.onclick=()=>{btn.disabled=true;btn.textContent='Loading…';loadBatch();};
    list.appendChild(btn);
  }
}

// ── Detail view ───────────────────────────────────────────────────────────────
async function selectKey(key){
  activeKey=key;
  // highlight in sidebar
  document.querySelectorAll('.key-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.key===key);
  });
  document.getElementById('detail-empty').style.display='none';
  const inner=document.getElementById('detail-inner');
  inner.style.display='flex';inner.style.flexDirection='column';
  inner.innerHTML='<div class="loading-row"><span class="spinner"></span>Loading value…</div>';
  try{
    const m=keyMeta[key]||{};
    const type=m.type||'string';
    const val=await getValue(key,type);
    // refresh ttl
    const ttl=await redis(['TTL',key]);
    keyMeta[key].ttl=ttl;
    renderDetail(key,type,val,ttl);
  }catch(e){
    inner.innerHTML=`<div class="loading-row" style="color:#b91c1c">${escHtml(e.message)}</div>`;
  }
}

async function getValue(key,type){
  if(type==='string')return await redis(['GET',key]);
  if(type==='hash')return await redis(['HGETALL',key]);
  if(type==='list')return await redis(['LRANGE',key,'0','-1']);
  if(type==='set')return await redis(['SMEMBERS',key]);
  if(type==='zset')return await redis(['ZRANGE',key,'0','-1','WITHSCORES']);
  return await redis(['GET',key]);
}

function renderDetail(key,type,val,ttl){
  const inner=document.getElementById('detail-inner');
  const ttlStr=ttl===-1?'No TTL':ttl===-2?'Expired':ttl+'s';
  const byteSize=typeof val==='string'?new Blob([val]).size:new Blob([JSON.stringify(val)]).size;
  const length=typeof val==='string'?val.length:(Array.isArray(val)?val.length:(val?Object.keys(val).length:0));

  inner.innerHTML=`
    <div class="detail-header">
      <div class="detail-key-name">${escHtml(key)}</div>
      <div class="detail-meta">
        <span class="meta-badge ${type}">${type.toUpperCase()}</span>
        <span class="meta-tag">Size: ${byteSize} B</span>
        <span class="meta-tag">Length: ${length}</span>
        <span class="ttl-tag" id="ttl-tag" onclick="toggleTTLEdit()">
          TTL: ${ttlStr}
          <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </span>
        <div id="ttl-edit-area" style="display:none"></div>
        <div class="detail-actions">
          <button class="btn-del" onclick="deleteKey(${JSON.stringify(key)})">Delete</button>
        </div>
      </div>
    </div>
    <div id="detail-body-wrap" style="flex:1;overflow:auto">
      ${renderValueBody(type,val)}
    </div>
    <div class="detail-footer">
      <button class="btn-save" onclick="saveValue(${JSON.stringify(key)},${JSON.stringify(type)})">Save</button>
    </div>`;
}

function renderValueBody(type,val){
  if(type==='string'){
    return `<div style="padding:10px 16px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;background:var(--surface);border-bottom:1px solid var(--border)">Text</div>
    <div class="value-area"><textarea class="value-textarea" id="val-editor">${escHtml(String(val??''))}</textarea></div>`;
  }
  if(type==='hash'&&val&&typeof val==='object'){
    const entries=Object.entries(val);
    const rows=entries.map(([k,v])=>`<tr><td class="key-col">${escHtml(k)}</td><td class="val-col">${escHtml(String(v))}</td></tr>`).join('');
    return `<div style="padding:10px 16px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;background:var(--surface);border-bottom:1px solid var(--border)">Fields (${entries.length})</div>
    <table class="data-table"><thead><tr><th style="width:180px">Field</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="value-area"><textarea class="value-textarea" id="val-editor" style="min-height:100px">${escHtml(JSON.stringify(val,null,2))}</textarea></div>`;
  }
  if((type==='list'||type==='set')&&Array.isArray(val)){
    const rows=val.map((v,i)=>`<tr><td class="idx">${i}</td><td class="val-col">${escHtml(String(v))}</td></tr>`).join('');
    return `<div style="padding:10px 16px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;background:var(--surface);border-bottom:1px solid var(--border)">${type==='list'?'Elements':'Members'} (${val.length})</div>
    <table class="data-table"><thead><tr><th style="width:50px;text-align:right">#</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="value-area"><textarea class="value-textarea" id="val-editor" style="min-height:80px">${escHtml(JSON.stringify(val,null,2))}</textarea></div>`;
  }
  if(type==='zset'&&Array.isArray(val)){
    const pairs=[];
    for(let i=0;i<val.length;i+=2)pairs.push([val[i],val[i+1]]);
    const rows=pairs.map(([m,s])=>`<tr><td class="val-col">${escHtml(m)}</td><td style="color:var(--text2);width:100px">${escHtml(s)}</td></tr>`).join('');
    return `<div style="padding:10px 16px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;background:var(--surface);border-bottom:1px solid var(--border)">Members (${pairs.length})</div>
    <table class="data-table"><thead><tr><th>Member</th><th style="width:100px">Score</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="value-area"><textarea class="value-textarea" id="val-editor" style="min-height:80px">${escHtml(JSON.stringify(val,null,2))}</textarea></div>`;
  }
  return `<div class="value-area"><textarea class="value-textarea" id="val-editor">${escHtml(JSON.stringify(val,null,2))}</textarea></div>`;
}

function toggleTTLEdit(){
  const area=document.getElementById('ttl-edit-area');
  const tag=document.getElementById('ttl-tag');
  if(area.style.display==='none'){
    const cur=keyMeta[activeKey]?.ttl;
    area.style.display='flex';
    tag.style.display='none';
    area.innerHTML=`<div class="ttl-edit">
      <input id="ttl-input" type="number" min="-1" value="${cur>0?cur:''}" placeholder="seconds or -1" />
      <button class="apply-btn" onclick="applyTTL()">Apply</button>
      <button class="cancel-btn" onclick="cancelTTLEdit()">✕</button>
    </div>`;
  }
}
function cancelTTLEdit(){
  document.getElementById('ttl-edit-area').style.display='none';
  document.getElementById('ttl-tag').style.display='flex';
}
async function applyTTL(){
  const v=document.getElementById('ttl-input').value.trim();
  if(!v){toast('Enter a TTL value','err');return;}
  try{
    if(parseInt(v)===-1)await redis(['PERSIST',activeKey]);
    else await redis(['EXPIRE',activeKey,v]);
    keyMeta[activeKey].ttl=parseInt(v);
    cancelTTLEdit();
    const tag=document.getElementById('ttl-tag');
    const ttlStr=parseInt(v)===-1?'No TTL':v+'s';
    tag.innerHTML=`TTL: ${ttlStr} <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`;
    toast('TTL updated');
  }catch(e){toast(e.message,'err');}
}

async function saveValue(key,type){
  const el=document.getElementById('val-editor');
  if(!el)return;
  const raw=el.value;
  try{
    await redis(['SET',key,raw]);
    const ttl=keyMeta[key]?.ttl;
    if(ttl>0)await redis(['EXPIRE',key,ttl]);
    keyMeta[key].type='string';
    toast('Saved');
    // refresh
    selectKey(key);
  }catch(e){toast(e.message,'err');}
}

async function deleteKey(key){
  if(!confirm('Delete "'+key+'"?'))return;
  try{
    await redis(['DEL',key]);
    allKeys=allKeys.filter(k=>k!==key);
    delete keyMeta[key];
    activeKey=null;
    document.getElementById('detail-empty').style.display='flex';
    document.getElementById('detail-inner').style.display='none';
    applyFilter();
    toast('Deleted: '+key);
  }catch(e){toast(e.message,'err');}
}

// ── Add key ───────────────────────────────────────────────────────────────────
function showAddKey(){
  document.getElementById('add-key-panel').style.display='block';
  document.getElementById('overlay').style.display='block';
  document.getElementById('ak-key').focus();
}
function hideAddKey(){
  document.getElementById('add-key-panel').style.display='none';
  document.getElementById('overlay').style.display='none';
}
function updateAddValueHint(){
  const type=document.getElementById('ak-type').value;
  const hints={string:'e.g. hello world',hash:'{"field":"value","name":"Alice"}',list:'["item1","item2","item3"]',set:'["a","b","c"]',zset:'[{"score":1,"member":"a"},{"score":2,"member":"b"}]'};
  document.getElementById('ak-val').placeholder=hints[type]||'value';
  document.getElementById('ak-val-label').textContent={string:'Value',hash:'Value (JSON object)',list:'Values (JSON array)',set:'Members (JSON array)',zset:'Members (JSON array of {score,member})'}[type];
}
async function createKey(){
  const key=document.getElementById('ak-key').value.trim();
  const type=document.getElementById('ak-type').value;
  const val=document.getElementById('ak-val').value;
  const ttl=document.getElementById('ak-ttl').value.trim();
  if(!key){toast('Key name required','err');return;}
  try{
    const cmds=[];
    if(type==='string')cmds.push(['SET',key,val]);
    else if(type==='hash'){const o=JSON.parse(val||'{}');const a=['HSET',key];Object.entries(o).forEach(([k,v])=>a.push(k,String(v)));cmds.push(a);}
    else if(type==='list')cmds.push(['RPUSH',key,...JSON.parse(val||'[]').map(String)]);
    else if(type==='set')cmds.push(['SADD',key,...JSON.parse(val||'[]').map(String)]);
    else if(type==='zset'){const arr=JSON.parse(val||'[]');arr.forEach(({score,member})=>cmds.push(['ZADD',key,String(score),String(member)]));}
    if(ttl)cmds.push(['EXPIRE',key,ttl]);
    await pipeline(cmds);
    const [t,ex]=await pipeline([['TYPE',key],['TTL',key]]);
    allKeys.unshift(key);
    keyMeta[key]={type:t,ttl:ex};
    hideAddKey();
    applyFilter();
    toast('Key created!');
    selectKey(key);
  }catch(e){toast(e.message,'err');}
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.className='toast',3200);
}

// ── Sidebar resize ────────────────────────────────────────────────────────────
(()=>{
  const resizer=document.getElementById('resizer');
  const sidebar=document.getElementById('sidebar');
  let dragging=false,startX=0,startW=0;
  resizer.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;document.body.style.cursor='col-resize';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!dragging)return;const w=Math.max(180,Math.min(500,startW+e.clientX-startX));sidebar.style.width=w+'px';sidebar.style.minWidth=w+'px';});
  document.addEventListener('mouseup',()=>{dragging=false;document.body.style.cursor='';});
})();

// enter on setup
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('setup').style.display!=='none')connect();
});
</script>
